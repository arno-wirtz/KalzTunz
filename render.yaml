# KalzTunz — Single unified Render deployment
# One web service: builds React then serves it from FastAPI (no CORS, no split domains)

services:

  # ── Main web service (FastAPI + built React frontend) ─────────────
  - type: web
    name: kalztunz
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install --only-binary=scipy -r requirements.txt
      cd frontend && npm ci && npm run build && cd ..
    startCommand: gunicorn -w 2 -k uvicorn.workers.UvicornWorker app:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: kalztunz.onrender.com,*.onrender.com,localhost,127.0.0.1
      - key: CORS_ORIGINS
        value: https://kalztunz.onrender.com
      - key: FRONTEND_URL
        value: https://kalztunz.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: kalztunz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: kalztunz-redis
          type: redis
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  # ── RQ background worker ───────────────────────────────────────────
  - type: worker
    name: kalztunz-worker
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install --only-binary=scipy -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kalztunz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: kalztunz-redis
          type: redis
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: kalztunz-db
    databaseName: kalztunz
    plan: free

  - name: kalztunz-redis
    plan: free
    ipAllowList: []
