version: '3.9'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       kalztunz
      POSTGRES_USER:     kalztunz_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kalztunz_dev}
    volumes: [pg_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U kalztunz_user -d kalztunz"]
      interval: 5s; timeout: 5s; retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-kalztunz_redis}
    volumes: [redis_data:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD","redis-cli","-a","${REDIS_PASSWORD:-kalztunz_redis}","ping"]
      interval: 5s; timeout: 3s; retries: 10

  # Single service — FastAPI serves the built React frontend
  app:
    build: { context: ., dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL:          postgresql://kalztunz_user:${DB_PASSWORD:-kalztunz_dev}@db:5432/kalztunz
      REDIS_URL:             redis://:${REDIS_PASSWORD:-kalztunz_redis}@redis:6379/0
      SECRET_KEY:            ${SECRET_KEY:-dev_secret_32chars_change_me_now}
      ENVIRONMENT:           ${ENVIRONMENT:-development}
      ALLOWED_HOSTS:         ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ORIGINS:          http://localhost:8000
      FRONTEND_URL:          http://localhost:8000
      SPOTIFY_CLIENT_ID:     ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID:      ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET:  ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID:      ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET:  ${GITHUB_CLIENT_SECRET:-}
    volumes: [uploads:/app/uploads]

  worker:
    build: { context: ., dockerfile: worker.Dockerfile }
    restart: unless-stopped
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://kalztunz_user:${DB_PASSWORD:-kalztunz_dev}@db:5432/kalztunz
      REDIS_URL:    redis://:${REDIS_PASSWORD:-kalztunz_redis}@redis:6379/0
    volumes: [uploads:/app/uploads]

volumes:
  pg_data:
  redis_data:
  uploads:
